[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-bert-ner-conll"
version = "1.0.0"
description = "BERT and RoBERTa sequence labelling with auditable CoNLL evaluation"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Spiros Grouztidis"}]
dependencies = ["torch==2.6.0", "transformers==4.57.1", "numpy==2.2.6", "seqeval==1.2.2", "scikit-learn==1.7.2"]

[project.scripts]
conll-ner = "conll_ner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
